<section class="contact" id="contact" aria-labelledby="contact-title">
  <div class="cwrap">
    <img class="cfrag" src="assets/tubes/piece.webp" alt="" aria-hidden="true" loading="lazy" decoding="async">
    <div class="ccard">
      <div class="ccard__form">
        <p class="ccard__brand"><svg viewBox="0 0 40 24" aria-hidden="true"><path d="M11 4 3 12l8 8M29 4l8 8-8 8M23 2l-6 20"/></svg>Rahat</p>
        <h2 class="ccard__title" id="contact-title">Let's build <em>beyond.</em></h2>
        <p class="ccard__sub">Two steps. I reply within 24 hours.</p>
        <div class="seg" data-at="1">
          <button type="button" class="seg__b" data-go="1" aria-current="step">Project</button>
          <button type="button" class="seg__b" data-go="2" disabled>Brief</button>
        </div>
        <div class="csteps">
          <div class="cstep" data-step="1">
            <p class="ccard__q" id="c-q">You may want…</p>
            <div class="opts" role="group" aria-labelledby="c-q">
              <button type="button" class="opt" data-type="Web app"><i>01</i>Web app<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
              <button type="button" class="opt" data-type="Android app"><i>02</i>Android app<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
              <button type="button" class="opt" data-type="Developer tools"><i>03</i>Developer tools<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
              <button type="button" class="opt" data-type="AI workflow"><i>04</i>AI workflow<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
            </div>
          </div>
          <form class="cstep form" data-step="2" novalidate inert>
            <p class="picked">Project: <b></b> <button type="button" class="picked__x">Change</button></p>
            <input type="hidden" name="type">
            <div class="field"><label for="f-name">Name <small></small></label><input id="f-name" name="name" type="text" placeholder="Your name" autocomplete="name" required></div>
            <div class="field"><label for="f-mail">Email <small></small></label><input id="f-mail" name="email" type="email" placeholder="you@company.com" autocomplete="email" required></div>
            <div class="field"><label for="f-msg">The idea <small></small></label><input id="f-msg" name="message" type="text" placeholder="One line is enough" required></div>
            <button type="submit" class="cbtn"><span class="btn__txt">Send the brief</span></button>
            <p class="form__ok" role="status" aria-live="polite"></p>
          </form>
        </div>
        <ul class="socials" aria-label="Find Rahat online">
          <li><a class="social" href="https://github.com/rahatarch" target="_blank" rel="noopener">GitHub</a></li>
          <li><a class="social" href="https://marketplace.visualstudio.com/items?itemName=akkhar-labs.brud" target="_blank" rel="noopener">Marketplace</a></li>
          <li><a class="social" href="#" data-todo="LinkedIn URL">LinkedIn</a></li>
          <li><a class="social" href="mailto:hello@example.com" data-email="hello@example.com">Copy email</a></li>
        </ul>
      </div>
      <div class="ccard__art" aria-hidden="true">
        <div class="lit">
          <img src="assets/tubes/k0.webp" alt="" loading="lazy" decoding="async"><img src="assets/tubes/k1.webp" alt="" loading="lazy" decoding="async"><img src="assets/tubes/k2.webp" alt="" loading="lazy" decoding="async">
          <img src="assets/tubes/k3.webp" alt="" loading="lazy" decoding="async"><img src="assets/tubes/k4.webp" alt="" loading="lazy" decoding="async"><img src="assets/tubes/k5.webp" alt="" loading="lazy" decoding="async">
          <img src="assets/tubes/k6.webp" alt="" loading="lazy" decoding="async"><img src="assets/tubes/k7.webp" alt="" loading="lazy" decoding="async"><img src="assets/tubes/k8.webp" alt="" loading="lazy" decoding="async">
        </div>
        <div class="ccard__grid"></div>
        <p class="ccard__tag"><i class="dot"></i>Available · Q1 2027</p>
      </div>
    </div>
  </div>
</section>
